[theme]
primaryColor = "#00d4aa"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#c9d1d9"
font = "sans serif"

[client]
showErrorDetails = true
showWarningOnDirectExecution = true

[server]
maxUploadSize = 500
enableXsrfProtection = true
enableCORS = false

[logger]
level = "info"
